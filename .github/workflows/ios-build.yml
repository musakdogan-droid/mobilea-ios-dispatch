name: Build iOS MOBILEA Dispatch (Capacitor)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trouver le dossier du projet Capacitor
        run: |
          # Dispatch : on identifie le projet par son appId (fr.mobilea.dispatch),
          # ce qui marche meme si le nom du dossier contient un espace.
          CFG=""
          while IFS= read -r f; do
            if grep -q "fr.mobilea.dispatch" "$f"; then CFG="$f"; break; fi
          done < <(find . -name capacitor.config.json -not -path '*/node_modules/*')
          if [ -z "$CFG" ]; then
            echo "ERREUR : capacitor.config.json du dispatch (fr.mobilea.dispatch) introuvable."
            find . -maxdepth 2 -not -path '*/.git/*' | sort
            exit 1
          fi
          PROJ=$(dirname "$CFG")
          echo "Projet dispatch: $PROJ"
          echo "Projet trouve dans : $PROJ"
          echo "PROJ_DIR=$PROJ" >> "$GITHUB_ENV"

      - name: Installer dependances + generer projet iOS
        run: |
          cd "$PROJ_DIR"
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Config iOS (permissions + chiffrement + iOS 15)
        run: |
          cd "$PROJ_DIR/ios/App"
          PL="App/Info.plist"
          LOC="MOBILEA utilise votre position pour vous attribuer les courses proches, permettre au dispatch de suivre votre trajet en temps reel, et valider votre arrivee sur le lieu de prise en charge."
          LOCBG="MOBILEA utilise votre position, y compris en arriere-plan pendant une course, pour permettre au dispatch de suivre votre trajet en temps reel et valider votre arrivee."
          MIC="MOBILEA utilise le microphone uniquement lorsque vous choisissez d'enregistrer ou d'envoyer un message vocal au support ou a votre chauffeur depuis la messagerie."
          CAM="MOBILEA utilise l'appareil photo uniquement lorsque vous choisissez de prendre une photo pour votre profil, joindre un justificatif ou signaler un incident au support."
          pb() { /usr/libexec/PlistBuddy -c "$1" "$PL" 2>/dev/null; }
          pb "Set :NSLocationWhenInUseUsageDescription $LOC"       || pb "Add :NSLocationWhenInUseUsageDescription string $LOC"
          pb "Set :NSLocationAlwaysAndWhenInUseUsageDescription $LOCBG" || pb "Add :NSLocationAlwaysAndWhenInUseUsageDescription string $LOCBG"
          pb "Set :NSMicrophoneUsageDescription $MIC"              || pb "Add :NSMicrophoneUsageDescription string $MIC"
          pb "Set :NSCameraUsageDescription $CAM"                  || pb "Add :NSCameraUsageDescription string $CAM"
          pb "Set :ITSAppUsesNonExemptEncryption false"           || pb "Add :ITSAppUsesNonExemptEncryption bool false"
          echo "Permissions + chiffrement configures."
          if [ -f "Podfile" ]; then
            sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" Podfile || true
            echo "Podfile -> $(grep 'platform :ios' Podfile)"
          fi
          # --- Notifications push : entitlements + background mode + liaison projet ---
          # 1) Fichier d'entitlements avec aps-environment (indispensable pour recevoir un jeton push).
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '	<key>aps-environment</key>' \
            '	<string>production</string>' \
            '</dict>' \
            '</plist>' \
            > App/App.entitlements
          echo "App.entitlements cree."
          # 2) Background modes : reception push en arriere-plan ET suivi GPS
          #    en arriere-plan (indispensable pour que la position continue quand
          #    l'ecran est eteint / l'app en arriere-plan pendant une course).
          pb "Delete :UIBackgroundModes" 2>/dev/null || true
          pb "Add :UIBackgroundModes array" || true
          pb "Add :UIBackgroundModes:0 string remote-notification" || true
          # 3) Lier le fichier d'entitlements au projet Xcode (CODE_SIGN_ENTITLEMENTS)
          #    pour toutes les configurations de la cible App.
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" App.xcodeproj/project.pbxproj; then
            /usr/bin/sed -i '' -E 's/(PRODUCT_BUNDLE_IDENTIFIER = fr\.mobilea\.dispatch;)/CODE_SIGN_ENTITLEMENTS = App\/App.entitlements; \1/g' App.xcodeproj/project.pbxproj || true
            echo "CODE_SIGN_ENTITLEMENTS injecte dans le projet."
          else
            echo "CODE_SIGN_ENTITLEMENTS deja present."
          fi

      - name: Placer GoogleService-Info.plist (Firebase push)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          cd "$PROJ_DIR"
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
            echo "plist installe."
          else
            echo "ATTENTION: secret GOOGLE_SERVICE_INFO_PLIST_BASE64 absent (notifications inactives pour ce build)."
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd "$PROJ_DIR/ios/App"
          # Le Podfile de Capacitor a deja un post_install. On INSERE nos reglages
          # de signature juste apres sa ligne "post_install do |installer|"
          # (un second hook post_install est interdit par CocoaPods).
          if ! grep -q "MOBILEA_NO_POD_SIGNING" Podfile; then
            HOOK=$(grep -n "post_install do" Podfile | head -1 | cut -d: -f1)
            if [ -n "$HOOK" ]; then
              VAR=$(sed -n "${HOOK}p" Podfile | sed -E 's/.*\|([A-Za-z_]+)\|.*/\1/')
              awk -v line="$HOOK" -v var="$VAR" 'NR==line{
                print;
                print "  # MOBILEA_NO_POD_SIGNING";
                print "  " var ".pods_project.targets.each do |t|";
                print "    t.build_configurations.each do |c|";
                print "      c.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"";
                print "      c.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"";
                print "      c.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"";
                print "      c.build_settings[\"PROVISIONING_PROFILE_SPECIFIER\"] = \"\"";
                print "    end";
                print "  end";
                next
              }1' Podfile > Podfile.new && mv Podfile.new Podfile
            else
              printf '\npost_install do |installer|\n  # MOBILEA_NO_POD_SIGNING\n  installer.pods_project.targets.each do |t|\n    t.build_configurations.each do |c|\n      c.build_settings["CODE_SIGNING_ALLOWED"] = "NO"\n    end\n  end\nend\n' >> Podfile
            fi
          fi
          echo "----- Podfile final -----"
          cat Podfile
          pod install || pod install --repo-update

      - name: Import Certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Import Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Archive
        run: |
          cd "$PROJ_DIR/ios/App"

          # Extraction fiable de l'UUID du profil (methode Apple : security cms + plutil).
          # On desactive -e le temps de l'extraction pour ne pas casser le script si ca echoue.
          set +e
          UUID=$(security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | plutil -extract UUID raw - 2>/dev/null)
          set -e
          echo "UUID du profil trouve : [$UUID]"

          if [ -z "$UUID" ]; then
            echo "ERREUR : impossible d'extraire l'UUID du profil de provisioning."
            echo "--- Contenu lisible du profil (debut) ---"
            security cms -D -i /tmp/profile.mobileprovision 2>/dev/null | head -40 || true
            exit 1
          fi

          # Versions uniques forcees ici (Apple refuse un build deja envoye).
          MARKETING="1.0.$GITHUB_RUN_NUMBER"
          BUILD="$GITHUB_RUN_NUMBER"
          echo "Version marketing=$MARKETING  build=$BUILD"

          # Filet de securite : forcer aussi directement dans Info.plist.
          PLIST="App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD" "$PLIST"
            echo "Info.plist -> $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST") / $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          fi

          xcodebuild archive \
            -workspace "App.xcworkspace" \
            -scheme "App" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MOBILEA_Dispatch.xcarchive" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="PUZZP2FP89" \
            PROVISIONING_PROFILE="$UUID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            IPHONEOS_DEPLOYMENT_TARGET="15.0"

      - name: Export IPA
        run: |
          cat > /tmp/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>PUZZP2FP89</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>fr.mobilea.dispatch</key>
              <string>MOBILEA Dispatch Distribution</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MOBILEA_Dispatch.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist /tmp/exportOptions.plist

      - name: Upload vers App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_RAW: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys
          KEY_ID_CLEAN=$(printf '%s' "$API_KEY_ID" | tr -d ' \r\n')
          ISSUER_CLEAN=$(printf '%s' "$API_ISSUER_ID" | tr -d ' \r\n')
          KEYFILE=~/private_keys/AuthKey_${KEY_ID_CLEAN}.p8
          printf '%s' "$API_KEY_RAW" > /tmp/rawkey.txt
          if grep -q "BEGIN PRIVATE KEY" /tmp/rawkey.txt; then
            cp /tmp/rawkey.txt "$KEYFILE"
          else
            printf '%s' "$API_KEY_RAW" | tr -d ' \r\n' | base64 -d > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          xcrun altool --upload-app \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            --type ios \
            --apiKey "$KEY_ID_CLEAN" \
            --apiIssuer "$ISSUER_CLEAN"
          rm -f "$KEYFILE"
