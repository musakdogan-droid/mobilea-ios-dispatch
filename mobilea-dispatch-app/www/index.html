<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MOBILEA Dispatch</title>

  <!-- Manifest spécifique à cette app -->
  <link rel="manifest" href="/manifest-dispatch.json">
  <meta name="theme-color" content="#60a5fa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOBILEA Dispatch">
  <meta name="description" content="MOBILEA Dispatch — VTC Premium Île-de-France">

  <link rel="apple-touch-icon" href="/icons/dispatch-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/dispatch-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/dispatch-512.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0f1117; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    .loader { text-align: center; color: #60a5fa; }
    .loader-ring { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; color: #fff; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">MOBILEA Dispatch</div>
  </div>

  <script>
    // ── Enregistrement Service Worker ──────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function(reg) {
          console.log('[SW] Enregistré:', reg.scope);

          // Push Notifications
          if ('PushManager' in window) {
            reg.pushManager.getSubscription().then(function(sub) {
              console.log('[SW] Push subscription:', sub ? 'actif' : 'inactif');
            });
          }

          // Background Sync
          if ('sync' in reg) {
            reg.sync.register('sync-courses').catch(function() {});
          }

          // Periodic Sync
          if ('periodicSync' in reg) {
            reg.periodicSync.register('update-courses', { minInterval: 24 * 60 * 60 * 1000 }).catch(function() {});
          }
        })
        .catch(function(err) {
          console.log('[SW] Erreur:', err);
        });
    }

    // ── Redirection vers l'app principale ─────────────────────────
    // On attend que le SW soit prêt avant de rediriger
    function redirect() {
      var target = '/index.html#dispatch';
      if (window.location.pathname !== '/index.html') {
        window.location.replace(target);
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function() {
        redirect();
      });
      // Fallback si le SW prend trop de temps
      setTimeout(redirect, 1500);
    } else {
      redirect();
    }
  </script>
</body>
</html>
